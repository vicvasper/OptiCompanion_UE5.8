<!doctype html>
<meta charset="utf-8">
<title>Mascots</title>
<style>
  body { margin: 0; padding: 24px; background: #1b1c1f; color: #ddd; font: 14px system-ui, sans-serif; }
  .row { display: flex; gap: 40px; }
  .card { text-align: center; }
  .stack { position: relative; width: 192px; height: 192px; background: #2a2c31; border-radius: 12px; }
  .stack img { position: absolute; inset: 0; width: 192px; height: 192px; }
  .icons img { width: 32px; height: 32px; margin: 12px 6px 0; background: #2a2c31; padding: 4px; border-radius: 6px; }
</style>
<div class="row">
  <div class="card"><div class="stack"><img src="bee/wings.svg"><img src="bee/legs_front.svg"><img src="bee/body.svg"></div><p>bee</p></div>
  <div class="card"><div class="stack"><img src="fruitfly/wings.svg"><img src="fruitfly/legs_front.svg"><img src="fruitfly/body.svg"></div><p>fruitfly</p></div>
  <div class="card"><div class="stack"><img src="ladybug/wings.svg"><img src="ladybug/legs_front.svg"><img src="ladybug/body.svg"></div><p>ladybug</p></div>
  <div class="card"><div class="stack"><img src="oc/wings.svg"><img src="oc/legs_front.svg"><img src="oc/body.svg"></div><p>oc (default)</p></div>
</div>
<div class="icons"><img src="bee/icon.svg"><img src="fruitfly/icon.svg"><img src="ladybug/icon.svg"><img src="oc/icon.svg"> <span>icons at menu size</span></div>
